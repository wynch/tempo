<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1b19" media="(prefers-color-scheme: dark)">
<meta name="description" content="Recurring task counters, from a circuit step to a year.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tempo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <div id="wk">
    <span class="brand">Tempo</span>
    <div id="crumbs"></div>
    <button class="hbtn nowbtn" data-act="now">Now</button>
    <button class="hbtn" data-act="new" aria-label="New counter">+</button>
    <button class="hbtn" data-act="menu" aria-label="Menu">⋯</button>
  </div>
  <div id="surface"><div id="boot">Opening…</div></div>
  <div id="empty">Nothing to count yet.<br>Tap <b>+</b> to add your first counter.</div>
  <div id="now"><span></span></div>
  <div id="ctl">
    <button data-act="reset" aria-label="Reset">↺</button>
    <button class="play" data-act="play" aria-label="Play or pause">▶</button>
    <button data-act="skip" aria-label="Skip step">⏭</button>
  </div>
  <div id="menu">
    <button data-act="counters">Counters<small>Add, change or remove what you count</small></button>
    <button data-act="export">Export data<small>Save everything as one file</small></button>
    <button data-act="import">Import data<small>Replace everything from a file</small></button>
    <button data-act="sample">Load sample data<small>Replace everything with the demo</small></button>
    <button data-act="clear">Start empty<small>Remove every counter and its history</small></button>
  </div>
  <div id="sheet"></div>
  <input type="file" id="file" accept="application/json,.json" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
